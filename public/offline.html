<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#01092a" />
    <meta name="color-scheme" content="light dark" />
    <title>Talvuno is offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #01092a; color: #f1f5f9; }
        p { color: #cbd5e1; }
      }
      main { max-width: 22rem; text-align: center; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
      p { margin: 0 0 1.25rem; line-height: 1.5; color: #475569; }
      button {
        font: inherit;
        padding: 0.6rem 1.25rem;
        border: 0;
        border-radius: 0.6rem;
        background: #0a6fe0;
        color: #fff;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #1e8bff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>Talvuno needs a connection to place calls and send messages. It will pick up where you left off once you are back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
